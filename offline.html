<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline — Abedin M.</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f3eed9" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14130f" />

<link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
<link rel="alternate icon" type="image/png" href="./assets/favicon-32.png" />
<link rel="stylesheet" href="./assets/fonts/fonts.css" />
<link rel="stylesheet" href="./style.css" />
<script>
  (function(){try{var t=localStorage.getItem('abedin-theme')||
    (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    document.documentElement.dataset.theme=t;}catch(e){}})();
</script>
<style>
  /* OS cursor — this page doesn't load the custom-cursor JS */
  html, body { cursor: auto !important; }
  a, button { cursor: pointer !important; }
  .off-wrap {
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 60px var(--pad-x);
    text-align: center;
  }
  .off-card { max-width: 560px; }
  .off-kicker {
    font-family: var(--mono); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--orange); font-weight: 600;
    margin-bottom: 14px;
  }
  .off-card h1 {
    font-family: var(--display); font-weight: 700;
    font-size: clamp(48px, 8vw, 96px);
    line-height: 0.95; letter-spacing: -0.04em;
    color: var(--ink);
    margin-bottom: 18px;
  }
  .off-card h1 em {
    font-family: var(--serif); font-style: italic;
    color: var(--orange); font-weight: 500;
  }
  .off-card p {
    font-size: clamp(15px, 1.4vw, 18px);
    line-height: 1.55;
    color: var(--ink-muted);
    margin-bottom: 14px;
  }
  .off-actions {
    display: flex; gap: 14px;
    justify-content: center; flex-wrap: wrap;
    margin-top: 28px;
  }
  .off-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 24px;
    background: var(--ink); color: var(--cream);
    border-radius: 99px;
    font-family: var(--sans); font-weight: 500; font-size: 14px;
    text-decoration: none;
    border: none; cursor: pointer;
  }
  .off-btn--ghost {
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--cream-line-strong);
  }
  .off-status {
    margin-top: 32px; padding-top: 20px;
    border-top: 1px solid var(--cream-line);
    font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--ink-muted);
  }
  .off-status .dot {
    display: inline-block; width: 8px; height: 8px;
    border-radius: 50%; background: #c92a2a;
    margin-right: 6px; vertical-align: middle;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(201, 42, 42, 0.6); }
    70% { box-shadow: 0 0 0 8px rgba(201, 42, 42, 0); }
  }
</style>
<!-- analytics:cloudflare:start -->
<!-- Cloudflare Web Analytics — set CF_BEACON_TOKEN in scripts/_inject_analytics.py and re-run to enable. -->
<!-- analytics:cloudflare:end -->
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<main class="off-wrap">
  <div class="off-card">
    <p class="off-kicker">No connection</p>
    <h1>You're <em>offline.</em></h1>
    <p>The page you wanted isn't in the cache. Try retrying — or hop back to the homepage, which works offline.</p>
    <p>Either you're disconnected, or the server is taking a coffee break. Both are temporary.</p>
    <div class="off-actions">
      <button class="off-btn" type="button" onclick="location.reload()">Retry →</button>
      <a class="off-btn off-btn--ghost" href="./">Back to homepage</a>
    </div>
    <p class="off-status" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>Connection status: <strong id="net-status">offline</strong>
    </p>
  </div>
</main>

<script>
  // Live network status — update the dot + label when connection comes back.
  const status = document.getElementById('net-status');
  function paint() {
    const online = navigator.onLine;
    status.textContent = online ? 'online — retry now' : 'offline';
    document.querySelector('.dot').style.background = online ? '#65d57a' : '#c92a2a';
  }
  paint();
  addEventListener('online', paint);
  addEventListener('offline', paint);
  // Auto-retry once we come back online
  addEventListener('online', () => {
    setTimeout(() => location.reload(), 800);
  });
</script>
</body>
</html>
